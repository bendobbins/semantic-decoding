# Story list for SE_emptyTask, read by preprocessing/make_story_textgrids.py.
# Written from the handwritten list of story times (runs 10, 11, 12, 20; run 01 is left out for now).
#
# Times are AUDIO times: positions in data/SE_emptyTask_<run>_in.wav, written "m:ss" or "m:ss.ss"
# (minutes can go past 59, e.g. "60:00"). The script converts them to recording time with the run's
# offset, clips stories to their recording, and moves a story edge that lands inside a word to the
# middle of the silence next to it.
#
# [runs.<run>]          one per run, named as in the file names ("10", or "01" with its leading zero)
#   offset              audio time - recording time, in seconds
#   audio_transcript    optional: an audio-time start<TAB>end<TAB>word transcript in data/. The offset is
#                       measured from it and must match `offset` (which can then be left out).
#
# [[stories]]           one TextGrid each, listed in this order in the stats file
#   name                the file name, without .TextGrid (no / \ : or "). To rename a TextGrid, rename it
#                       here too, or regenerating makes a second copy under the old name. Where a file has
#                       been renamed, its name on the handwritten list is in a comment.
#   run                 the run it was played in
#   parts               [label, start, end], each part starting where the one before it ends. The story
#                       runs from the first start to the last end. To leave something out (like a room
#                       conversation), make separate stories: a gap inside one story would be written as
#                       silence, and the neural data there isn't silence.
#   notes               optional, copied into the stats file
#
# A story entirely outside its recording gets no TextGrid; the stats file lists it.

[runs.10]
offset = 1711.265961
audio_transcript = "original_data/SE_emptyTask_10_story_words.txt.bak.txt"

[runs.11]
offset = 1411.595257
audio_transcript = "original_data/SE_emptyTask_11_story_words_original.txt"

[runs.12]
offset = 0.0            # labels/ was already in audio time

[runs.20]
offset = 0.0            # labels/ was already in audio time


