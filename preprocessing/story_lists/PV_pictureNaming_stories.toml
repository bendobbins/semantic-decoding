# Story list for PV_pictureNaming, read by preprocessing/make_story_textgrids.py (SE_emptyTask_stories.toml documents the format).
#
# PV's runs are live conversations between PV and a researcher, not stories; the "pictureNaming" and
# "sentenceReading" in the file names are left over from the original task names. Each run is one "story"
# spanning its whole recording, using every word from both speakers (no speaker labels yet).
#
# labels/PV_pictureNaming_<run>_story_words.txt are unchanged copies of original_data/PV_pictureNaming_<run>_conversation_in_labels_whisperx.txt.
# Offset 0: each _in.wav is the length of its recording to within 0.06 s. Story ends are recording lengths
# (n_samples / 2000 Hz), in seconds. original_data/PV_pictureNaming_<run>.mat are symlinks to the _conversation.mat files.

